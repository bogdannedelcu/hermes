# Apache reverse-proxy snippet — pune-l in /etc/apache2/sites-available/ebsv2.conf
# inauntrul <VirtualHost *:8080> existent (sau ca site dedicat 8081).
#
# Doua optiuni — alege una.

# ────────────────────────────────────────────────────────────────────────────
# OPTIUNEA A — mount sub vhost-ul existent: /timesfm/* → localhost:8081/*
# Recomandata pentru uz intern. Accesul respecta autentificarea aplicatiei.
# ────────────────────────────────────────────────────────────────────────────
#   <Location /timesfm>
#       ProxyPass        http://127.0.0.1:8081
#       ProxyPassReverse http://127.0.0.1:8081
#       # Optional: restrange accesul la IP-uri locale
#       Require ip 127.0.0.1 192.168.1.0/24
#   </Location>

# ────────────────────────────────────────────────────────────────────────────
# OPTIUNEA B — vhost separat pe portul 8081 (acces direct la serviciu)
# Util daca vrei sa testezi din browser sau alte clienti.
# ────────────────────────────────────────────────────────────────────────────
#   Listen 8081
#   <VirtualHost *:8081>
#       ServerName 192.168.1.95
#       ErrorLog  ${APACHE_LOG_DIR}/timesfm_error.log
#       CustomLog ${APACHE_LOG_DIR}/timesfm_access.log combined
#
#       ProxyRequests Off
#       ProxyPreserveHost On
#       ProxyPass        / http://127.0.0.1:8082/
#       ProxyPassReverse / http://127.0.0.1:8082/
#       # NOTA: schimba serviciul Python sa asculte pe 8082 daca alegi varianta asta,
#       # ca sa nu intre in conflict cu portul Apache.
#
#       Require ip 127.0.0.1 192.168.1.0/24
#   </VirtualHost>
